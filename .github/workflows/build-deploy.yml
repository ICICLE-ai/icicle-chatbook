name: Build & Push & Deploy

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --frozen

      - name: Lint notebook
        run: uv run marimo check notebooks/rag_chat_marimo.py

      - name: Run notebook end to end
        run: uv run marimo export html notebooks/rag_chat_marimo.py -o /tmp/notebook.html

  build-and-push-images:
    runs-on: ubuntu-latest
    needs: [check]
    if: github.event_name != 'pull_request'
    timeout-minutes: 35

    permissions:
      contents: write
      packages: write

    outputs:
      version_tag: ${{ steps.tags.outputs.version_tag }}
      image_tags: ${{ steps.tags.outputs.image_tags }}
      image_name: ${{ steps.tags.outputs.image_name }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Compute Docker tags
        id: tags
        shell: bash
        run: |
          # GHCR rejects uppercase, and org names like ICICLE-ai have it.
          NAME="${{ env.IMAGE_NAME }}"
          NAME="${NAME:-${{ github.repository }}}"
          NAME="$(printf '%s' "$NAME" | tr '[:upper:]' '[:lower:]')"
          IMAGE="${{ env.REGISTRY }}/${NAME}"

          echo "image_name=${NAME}" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"

            echo "version_tag=${VERSION}" >> "$GITHUB_OUTPUT"

            {
              echo "image_tags<<EOF"
              echo "${IMAGE}:latest"
              echo "${IMAGE}:${VERSION}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "version_tag=latest" >> "$GITHUB_OUTPUT"

            {
              echo "image_tags<<EOF"
              echo "${IMAGE}:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        timeout-minutes: 30
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.image_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=ICICLE AI Chatbook — marimo RAG notebook over the ICICLE embed, vector and LiteLLM services
            org.opencontainers.image.licenses=GPL-3.0
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version_tag }}
            org.opencontainers.image.title=icicle-chatbook
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test latest image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ steps.tags.outputs.image_name }}:latest"
          docker run --rm -d --name chatbook-smoke -p 8080:8080 "$IMAGE"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 5 http://localhost:8080/health >/dev/null; then
              echo "Container healthy after ${attempt} poll(s)."
              docker rm -f chatbook-smoke
              exit 0
            fi
            sleep 2
          done
          echo "Container never became healthy."
          docker logs chatbook-smoke
          docker rm -f chatbook-smoke
          exit 1

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          name: v${{ steps.tags.outputs.version_tag }}
          body: |
            Container image: `ghcr.io/${{ steps.tags.outputs.image_name }}:${{ steps.tags.outputs.version_tag }}`

            Image is **linux/amd64** (GitHub `ubuntu-latest` default; no cross-arch build).

  deploy-prod:
    runs-on: ubuntu-latest
    needs: [build-and-push-images]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15

    steps:
      # Pod lives in the icicleai tenant; TAPIS_TOKEN is a TACC service token,
      # which is authorized to manage pods in child tenants.
      - name: Restart production Tapis pod
        timeout-minutes: 2
        uses: fjogeleit/http-request-action@v1
        with:
          url: 'https://icicleai.tapis.io/v3/pods/${{ vars.POD_ID }}/restart'
          method: 'GET'
          customHeaders: '{"Content-Type": "application/json", "X-Tapis-Token": "${{ secrets.TAPIS_TOKEN }}"}'

      - name: Wait for pod restart
        run: sleep 60

      - name: Wait for production health
        timeout-minutes: 10
        run: |
          URL="${{ vars.PROD_BASE_URL }}/health"
          DEADLINE=$(( SECONDS + 480 ))
          attempt=0
          until curl --fail --show-error --silent \
                  --connect-timeout 10 --max-time 15 "$URL" >/dev/null; do
            if (( SECONDS >= DEADLINE )); then
              echo "Service did not become healthy within the wait window."
              exit 1
            fi
            attempt=$(( attempt + 1 ))
            echo "Not healthy yet (attempt ${attempt}); waiting 20s ..."
            sleep 20
          done
          echo "Service healthy after ${attempt} poll(s)."
